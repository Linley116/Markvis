name: Release

# 版本变动信息落到 GitHub Releases：
#   - 维护者把新版本写进 scripts/versions.json 并打 v* tag 推上来 → 发布该版本
#   - 版本清单/发布脚本有改动推到 main → 补齐历史里还没有 Release 的版本（幂等）
#   - 日常 push / PR 不触发；本工作流只做发布，不跑 CI
on:
  push:
    branches:
      - main
    paths:
      - 'scripts/versions.json'
      - 'scripts/gen-changelog.js'
      - 'scripts/publish-release.js'
      - 'CHANGELOG.md'
      - '.github/workflows/release.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '只发布指定版本（留空则补齐所有缺失版本）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # 脚本要 git push tag，显式把 token 写进 remote URL
      - name: Configure git credentials
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Regenerate changelog
        run: node scripts/gen-changelog.js

      - name: Publish releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            node scripts/publish-release.js "$INPUT_VERSION"
          else
            node scripts/publish-release.js
          fi
