name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript test dependency
        run: npm ci

      - name: Install isolated test browser
        run: npx playwright-core install chromium

      - name: Run native XCTest suite
        run: |
          set +e
          ./test/native.sh > native.log 2>&1
          status=$?
          cat native.log
          if [ $status -ne 0 ]; then
            tail -n 60 native.log | sed 's/^/::error::/'
          fi
          exit $status

      - name: Build application
        run: ./build.sh --keep

      - name: Run engine assertions
        run: npm run test:engine

      - name: Run feature assertions
        run: npm run test:features

      - name: Run PDF regression
        run: npm run test:pdf
