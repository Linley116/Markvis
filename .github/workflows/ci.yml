name: CI

# 日常 push / PR 不自动跑；需要完整验证时在 Actions 页面手动 Run workflow。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 项目需要 Swift 6；macos-14 默认仍是 Swift 5.10，macos-15 自带 Xcode 16
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript test dependency
        run: npm ci

      - name: Install isolated test browser
        run: npx playwright-core install chromium

      - name: Check changelog is in sync
        run: node scripts/gen-changelog.js --check

      - name: Run native XCTest suite
        run: |
          set +e
          ./test/native.sh > native.log 2>&1
          status=$?
          cat native.log
          if [ $status -ne 0 ]; then
            tail -n 60 native.log | sed 's/^/::error::/'
          fi
          exit $status

      - name: Build application
        run: ./build.sh --keep

      - name: Run engine assertions
        run: npm run test:engine

      - name: Run feature assertions
        run: npm run test:features

      - name: Run PDF regression
        run: |
          set +e
          npm run test:pdf > pdf.log 2>&1
          status=$?
          cat pdf.log
          if [ $status -ne 0 ]; then
            tail -n 60 pdf.log | sed 's/^/::error::/'
          fi
          exit $status
