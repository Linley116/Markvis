<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarkFrame</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="scroll">
  <article id="write" contenteditable="true" spellcheck="true" lang="en"></article>
  <textarea id="source" spellcheck="false" style="display:none"></textarea>
</main>
<div id="status">
  <span id="mode" class="pill">Live</span>
  <span id="wordcount">0 字</span>
  <button id="mf-outline-btn" class="mf-chip mf-on" title="显示/隐藏大纲 (Cmd+Shift+O)">大纲</button>
  <button id="mf-theme-btn" class="mf-chip">跟随系统</button>
  <span id="hint">Cmd+/ 源码 · Cmd+F 查找 · Cmd+Shift+O 大纲</span>
</div>
<div id="mf-math-editor">
  <textarea id="mf-math-input" spellcheck="false" placeholder="TeX 或 mermaid 源码"></textarea>
  <div class="mf-me-row">
    <span class="mf-me-hint">Cmd+Enter 应用 · Esc 取消</span>
    <button id="mf-me-cancel" type="button">取消</button>
    <button id="mf-me-apply" type="button">应用</button>
  </div>
</div>
<script src="vendor/highlight.min.js"></script>
<script src="engine.js"></script>
<script src="features/outline.js"></script>
<script src="features/search.js"></script>
<script src="features/focus.js"></script>
<script src="features/theme.js"></script>
<script src="features/autosave.js"></script>
</body>
</html>
